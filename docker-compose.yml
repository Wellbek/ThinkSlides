version: "3.9"

networks:
  thinkslides-network:
    driver: bridge

services:
  # ────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thinkslides-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thinkslides}
      POSTGRES_USER: ${POSTGRES_USER:-thinkslides}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkslides_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - thinkslides-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thinkslides}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────
  # Redis
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: thinkslides-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - thinkslides-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────
  # Next.js Frontend
  # ────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: thinkslides-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - AI_SERVICE_URL=http://ai-service:8000
      - NEXT_PUBLIC_API_BASE=
      - NEXT_PUBLIC_AI_URL=http://ai-service:8000
    networks:
      - thinkslides-network
    depends_on:
      orchestrator:
        condition: service_healthy

  # ────────────────────────────────────────────
  # Go Orchestrator
  # ────────────────────────────────────────────
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: thinkslides-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - AI_SERVICE_URL=http://ai-service:${AI_SERVICE_PORT:-8000}
      - JWT_SECRET=${JWT_SECRET:-thinkslides-dev-jwt-secret-change-in-production}
      - DATABASE_URL=postgresql://thinkslides:thinkslides_dev_password@postgres:5432/thinkslides
      - UPLOAD_DIR=/app/uploads
      - TEMPLATE_DIR=/app/templates
      - OUTPUT_DIR=/app/output
      - PREVIEW_DIR=/app/previews
    volumes:
      - uploads:${UPLOAD_DIR:-/app/uploads}
      - templates:${TEMPLATE_DIR:-/app/templates}
      - output:${OUTPUT_DIR:-/app/output}
      - previews:${PREVIEW_DIR:-/app/previews}
    networks:
      - thinkslides-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # ────────────────────────────────────────────
  # Python AI Service
  # ────────────────────────────────────────────
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: thinkslides-ai
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://thinkslides:thinkslides_dev_password@postgres:5432/thinkslides}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLM_PROVIDER=${LLM_PROVIDER:-zhipu}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4}
      - ZHIPU_WEB_SEARCH_ENGINE=${ZHIPU_WEB_SEARCH_ENGINE:-search_std}
      - ZHIPU_WEB_SEARCH_CONTENT_SIZE=${ZHIPU_WEB_SEARCH_CONTENT_SIZE:-high}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-zhipu}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TAVILY_SEARCH_DEPTH=${TAVILY_SEARCH_DEPTH:-advanced}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - TEMPLATE_DIR=${TEMPLATE_DIR:-/app/templates}
      - OUTPUT_DIR=${OUTPUT_DIR:-/app/output}
      - PREVIEW_OUTPUT_DIR=${PREVIEW_OUTPUT_DIR:-/app/previews}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET=${JWT_SECRET:-thinkslides-dev-jwt-secret-change-in-production}
      # Key-encryption key for provider credentials stored via the Settings UI.
      # Deliberately has no default: without it the settings API refuses to
      # store credentials rather than persisting them unencrypted.
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - SETTINGS_ENCRYPTION_KEYS_RETIRED=${SETTINGS_ENCRYPTION_KEYS_RETIRED}
      # Agent-written Python, off unless an operator turns it on. See
      # app/config.py: the AST gate and the sandboxed process stand whatever
      # this is set to, but the container hardening below is part of the
      # deployment rather than of the service, and a default that assumed it
      # would be deciding a security question on the operator's behalf.
      - CODE_AMENDMENT_ENABLED=${CODE_AMENDMENT_ENABLED:-false}
    # ── Containment ──────────────────────────────────────────────────────
    # The third of the three layers `edit_deck_with_code` rests on. The
    # first is the AST gate, which decides what a script may say; the second
    # is the privilege-dropped process the runner starts. This is what makes
    # both worth having: without it the service ran as root, unlimited, with
    # every provider key in its environment and Postgres and Redis one
    # connect() away.
    #
    # `no-new-privileges` stops a setuid binary regaining what the runner
    # dropped. `cap_drop: ALL` leaves the process no capability to use if it
    # somehow gets back to uid 0 - the service binds 8000, which needs none.
    # `pids_limit` is the container-level answer to a fork bomb, behind the
    # runner's own RLIMIT_NPROC. The memory limit bounds the whole container
    # the way RLIMIT_AS bounds one script.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${AI_MEM_LIMIT:-4g}
    # Note for an existing deployment: this service now runs as uid 10001
    # rather than as root. A *fresh* named volume takes its ownership from
    # the image, which the Dockerfile chowns, so a new stack is correct with
    # no further action. Volumes created while the service ran as root are
    # still root-owned and it will not be able to write to them - `make
    # clean` (or a one-off `chown -R 10001:10001` inside each volume) is what
    # moves an existing stack over.
    networks:
      - thinkslides-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    volumes:
      - uploads:${UPLOAD_DIR:-/app/uploads}
      - templates:${TEMPLATE_DIR:-/app/templates}
      - output:${OUTPUT_DIR:-/app/output}
      - previews:${PREVIEW_OUTPUT_DIR:-/app/previews}

volumes:
  pgdata:
  redisdata:
  uploads:
  templates:
  output:
  previews:
