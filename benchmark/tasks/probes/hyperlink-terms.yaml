id: probe-hyperlink-terms
category: probes
prompt: |
  Three slides for a product team on why we moved our build cache from
  a shared disk to an object store. Cover the old failure mode, what we
  changed, and what it did to build times. No web research needed.
slides: 3
mode: simple
detail: concise
answers:
  - first
  - Go ahead as planned
followups:
  - Make every mention of 'object store' a hyperlink to https://example.com/object-store.
checklist:
  - The three pages' own content is otherwise unchanged by the request
  - Every mention of object store is a hyperlink to that address
  - No other text is linked
  - Link styling is legible against its background
  - The text itself is unchanged
