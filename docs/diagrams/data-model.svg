<title id="t">Data model</title>
<desc id="d">PostgreSQL is the system of record. Tenancy scopes every row; a session&#x27;s runs hold their checkpointed state, its events carry a per-session sequence for SSE replay, and the evidence store keeps sources and chunks with both a full-text and a vector index.</desc>
