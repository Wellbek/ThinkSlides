<text x="385.0" y="82.8" font-size="13" text-anchor="middle" fill="#000000" style="font-weight:700">Restore the snapshot</text>
<text x="385.0" y="99.0" font-size="11.5" text-anchor="middle" fill="#000000" style="">brief, design, slides and the</text>
<text x="385.0" y="115.3" font-size="11.5" text-anchor="middle" fill="#000000" style="">rendered file; no phase reruns</text>
