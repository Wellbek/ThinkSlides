<text x="620.0" y="367.7" font-size="11.5" text-anchor="middle" fill="#000000" style="">applied by every render, so a re-render keeps it</text>
<rect x="454.0" y="406.0" width="332.0" height="70.0" rx="7" fill="#FFF2CC" stroke="#1F2D3D" stroke-width="1.1"/>
<text x="620.0" y="435.4" font-size="13" text-anchor="middle" fill="#000000" style="font-weight:700">Placed by anchor, clear of content</text>
<text x="620.0" y="451.7" font-size="11.5" text-anchor="middle" fill="#000000" style="">shrunk, or left off a page, and said so</text>
