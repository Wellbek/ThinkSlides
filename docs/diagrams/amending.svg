<text x="1030.0" y="329.7" font-size="13" text-anchor="middle" fill="#000000" style="font-weight:700">Three gates</text>
<text x="1030.0" y="345.9" font-size="11.5" text-anchor="middle" fill="#000000" style="">syntax tree: no import outside an allowlist;</text>
<text x="1030.0" y="362.2" font-size="11.5" text-anchor="middle" fill="#000000" style="">process: no network, no keys, rlimits;</text>
<text x="1030.0" y="378.4" font-size="11.5" text-anchor="middle" fill="#000000" style="">artefact: no macro, no OLE, no external link</text>
