<text x="620.0" y="259.4" font-size="11.5" text-anchor="middle" fill="#000000" style="">overlay (text with live page numbers, a picture</text>
<text x="620.0" y="275.7" font-size="11.5" text-anchor="middle" fill="#000000" style="">they supplied, a QR code, a shape, a progress</text>
<text x="620.0" y="291.9" font-size="11.5" text-anchor="middle" fill="#000000" style="">bar, a watermark), a recolour, or a link</text>
