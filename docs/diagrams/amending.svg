<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-labelledby="t d" font-family="Calibri, Carlito, &#x27;Noto Sans&#x27;, &#x27;Segoe UI&#x27;, Arial, sans-serif">
<title id="t">Amending a finished deck</title>
<desc id="d">A message after a deck is finished restores the run&#x27;s snapshot and makes exactly the change asked for, by the narrowest means that can: a slide&#x27;s content goes back to compile, a deck-wide change is a typed operation applied by every render, and only what neither can say is written as a sandboxed script.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
