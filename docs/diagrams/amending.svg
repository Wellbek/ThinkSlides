<text x="210.0" y="435.5" font-size="11.5" text-anchor="middle" fill="#000000" style="">every other page is the page</text>
<text x="210.0" y="451.8" font-size="11.5" text-anchor="middle" fill="#000000" style="">the user already approved</text>
